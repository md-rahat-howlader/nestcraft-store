<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NestCraft | Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background: #1c1917; }</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-stone-900">NestCraft Admin</h2>
            <p class="text-xs text-stone-500 mt-1">Restricted Access - Md. Rahat Howlader</p>
        </div>
        {% if error %}
            <div class="mb-4 bg-red-50 border border-red-200 text-red-600 text-sm p-3 rounded-lg text-center font-semibold">
                {{ error }}
            </div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:outline-none focus:border-amber-800">
            </div>
            <div>
                <label class="block text-sm font-semibold text-stone-700 mb-1">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border border-stone-300 focus:outline-none focus:border-amber-800">
            </div>
            <button type="submit" class="w-full bg-amber-800 hover:bg-amber-700 text-white font-bold py-3.5 rounded-lg transition shadow">
                Login to Dashboard
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="/" class="text-xs text-stone-500 hover:underline">&larr; Return to Storefront</a>
        </div>
    </div>
</body>
</html>
